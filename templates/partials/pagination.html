{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="صفحه‌بندی">
  {% if page_obj.has_previous %}<a href="?{% if q %}q={{ q|urlencode }}&{% endif %}{% if active_category %}category={{ active_category.slug }}&{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">قبلی</a>{% endif %}
  <span class="current">صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a href="?{% if q %}q={{ q|urlencode }}&{% endif %}{% if active_category %}category={{ active_category.slug }}&{% endif %}page={{ page_obj.next_page_number }}" rel="next">بعدی</a>{% endif %}
</nav>
{% endif %}
